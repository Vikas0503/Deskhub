<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirect — Deskhub</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <p style="padding: 1rem; font-family: system-ui, sans-serif; color: #71717a;">Opening tickets…</p>
  <script>
    (function () {
      var id = new URLSearchParams(window.location.search).get('id');
      var q = id ? '?ticket=' + encodeURIComponent(id) : '';
      window.location.replace('./tickets.html' + q);
    })();
  </script>
  <noscript>
    <a href="./tickets.html">Continue to tickets</a>
  </noscript>
</body>
</html>
