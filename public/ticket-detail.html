<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket — Deskhub</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body data-page="ticket-detail">
  <div class="app-shell">
    <header class="app-bar" role="banner">
      <span class="app-bar__brand">Deskhub</span>
      <nav class="app-bar__nav" aria-label="Primary">
        <a href="./tickets.html">← Tickets</a>
        <a href="../dashboard.html">Dashboard</a>
      </nav>
    </header>

    <main class="app-shell__main layout layout--wide">
      <p id="detail-error" class="tickets-state tickets-state--error" role="alert" hidden></p>

      <article class="detail-card" id="detail-card" aria-labelledby="detail-title">
        <header class="detail-card__head detail-card__head--row">
          <div>
            <p class="detail-card__id" id="detail-id">—</p>
            <h1 class="detail-card__title" id="detail-title">—</h1>
          </div>
          <button type="button" id="detail-delete-btn" class="btn btn--danger">Delete ticket</button>
        </header>
        <dl class="detail-meta">
          <div><dt>Customer</dt><dd id="detail-customer">—</dd></div>
          <div>
            <dt>Priority</dt>
            <dd class="detail-meta__dd--control">
              <select id="detail-priority-select" class="detail-meta__select" aria-label="Ticket priority"></select>
              <span id="detail-priority-error" class="detail-inline-error" role="alert" hidden></span>
            </dd>
          </div>
          <div>
            <dt>Status</dt>
            <dd class="detail-meta__dd--control">
              <select id="detail-status-select" class="detail-meta__select" aria-label="Ticket status"></select>
              <span id="detail-status-error" class="detail-inline-error" role="alert" hidden></span>
            </dd>
          </div>
          <div>
            <dt>Assignee</dt>
            <dd class="detail-meta__dd--control">
              <select id="detail-assignee-select" class="detail-meta__select" aria-label="Assignee"></select>
              <span id="detail-assignee-error" class="detail-inline-error" role="alert" hidden></span>
            </dd>
          </div>
          <div><dt>Created</dt><dd id="detail-created">—</dd></div>
        </dl>

        <section class="detail-comments" aria-labelledby="comments-heading">
          <h2 id="comments-heading" class="detail-comments__title">Comments</h2>
          <p id="detail-comments-empty" class="empty-state empty-state--tight" hidden>No comments yet.</p>
          <div id="detail-comments" class="detail-comments__list"></div>

          <form id="comment-form" class="form form--inline-comment">
            <span id="comment-error" class="form__error" role="alert" hidden></span>
            <div class="form__field">
              <label for="comment-body">Add a comment</label>
              <textarea id="comment-body" name="body" rows="3" placeholder="Write an update…"></textarea>
            </div>
            <button type="submit" class="form__submit form__submit--narrow">Post comment</button>
          </form>
        </section>
      </article>
    </main>
  </div>

  <script type="module" src="../src/main.js"></script>
</body>
</html>
