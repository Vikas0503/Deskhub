<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tickets — Deskhub</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body data-page="tickets-list">
  <div class="app-shell">
    <header class="app-bar app-bar--sticky" role="banner">
      <span class="app-bar__brand">Deskhub</span>
      <nav class="app-bar__nav" aria-label="Primary">
        <a href="./tickets.html" class="app-bar__nav-link app-bar__nav-link--active">Tickets</a>
        <a href="../dashboard.html" class="app-bar__nav-link">Dashboard</a>
      </nav>
    </header>

    <main class="app-shell__main layout layout--wide">
      <section class="tickets-panel" aria-labelledby="tickets-heading">
        <div class="tickets-panel__head">
          <h1 id="tickets-heading" class="tickets-panel__title">Tickets</h1>
          <div class="tickets-panel__head-actions">
            <button type="button" id="tickets-reset-filters" class="btn btn--secondary">Reset filters</button>
            <button type="button" id="tickets-export-csv" class="btn btn--secondary">Export CSV</button>
            <button type="button" id="new-ticket-open" class="btn btn--primary">+ New ticket</button>
          </div>
        </div>

        <div class="tickets-toolbar" role="region" aria-label="Search and filter tickets">
          <label class="tickets-toolbar__item">
            <span class="tickets-toolbar__label">Search</span>
            <input type="search" id="ticket-search" placeholder="Title, customer, or ID..." autocomplete="off" />
          </label>
          <label class="tickets-toolbar__item">
            <span class="tickets-toolbar__label">Status</span>
            <select id="ticket-filter" aria-label="Filter by status">
              <option value="">All statuses</option>
              <option value="open">open</option>
              <option value="in progress">in progress</option>
              <option value="resolved">resolved</option>
              <option value="closed">closed</option>
              <option value="done">resolved + closed</option>
            </select>
          </label>
          <label class="tickets-toolbar__item">
            <span class="tickets-toolbar__label">Priority</span>
            <select id="ticket-priority-filter" aria-label="Filter by priority">
              <option value="">All priorities</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="urgent">urgent</option>
            </select>
          </label>
          <label class="tickets-toolbar__item">
            <span class="tickets-toolbar__label">Assignee</span>
            <select id="ticket-assignee-filter" aria-label="Filter by assignee"></select>
          </label>
          <label class="tickets-toolbar__item">
            <span class="tickets-toolbar__label">Sort</span>
            <select id="ticket-sort" aria-label="Sort tickets">
              <option value="newest">Newest</option>
              <option value="priority">Priority</option>
              <option value="status">Status</option>
            </select>
          </label>
        </div>

        <div id="tickets-error" class="tickets-state tickets-state--error" role="alert" hidden>
          <p id="tickets-error-message" class="tickets-state__message"></p>
          <button type="button" id="tickets-retry" class="btn btn--secondary">Retry</button>
        </div>

        <div id="tickets-loading" class="tickets-state tickets-state--loading" role="status" aria-live="polite" hidden>
          <span class="tickets-spinner" aria-hidden="true"></span>
          <span>Loading tickets…</span>
        </div>

        <p id="tickets-empty" class="tickets-state tickets-state--empty" hidden>No tickets found</p>

        <div id="tickets-table-wrap" class="tickets-table-wrap" hidden>
          <table class="tickets-table">
            <caption class="visually-hidden">Support tickets</caption>
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Title</th>
                <th scope="col">Customer</th>
                <th scope="col">Priority</th>
                <th scope="col">Status</th>
                <th scope="col">Assignee</th>
                <th scope="col">Created</th>
              </tr>
            </thead>
            <tbody id="tickets-tbody"></tbody>
          </table>
        </div>

        <nav id="tickets-pagination" class="tickets-pagination" aria-label="Ticket list pagination" hidden>
          <button type="button" id="tickets-page-prev" class="btn btn--secondary">Prev</button>
          <div class="tickets-pagination__center">
            <span id="tickets-page-indicator" class="tickets-page-indicator"></span>
            <div id="tickets-page-numbers" class="tickets-page-numbers" role="group" aria-label="Page numbers"></div>
          </div>
          <button type="button" id="tickets-page-next" class="btn btn--secondary">Next</button>
        </nav>
      </section>
    </main>
  </div>

  <div id="ticket-modal" class="modal" hidden>
    <div class="modal__backdrop" data-modal-close tabindex="-1" aria-hidden="true"></div>
    <div class="modal__panel panel" role="dialog" aria-modal="true" aria-labelledby="modal-title" data-modal-panel>
      <h2 id="modal-title" class="panel__title">New ticket</h2>
      <form id="new-ticket-form" class="form">
        <span id="new-ticket-error" class="form__error" role="alert" hidden></span>
        <div class="form__field">
          <label for="nt-title">Title</label>
          <input type="text" id="nt-title" name="title" autocomplete="off" placeholder="Short summary" />
          <span id="nt-title-error" class="form__field-error" role="alert" hidden></span>
        </div>
        <div class="form__field">
          <label for="nt-customer">Customer</label>
          <input type="text" id="nt-customer" name="customer" autocomplete="organization" placeholder="Organization" />
          <span id="nt-customer-error" class="form__field-error" role="alert" hidden></span>
        </div>
        <div class="form__row">
          <div class="form__field">
            <label for="nt-priority">Priority</label>
            <select id="nt-priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
            <span id="nt-priority-error" class="form__field-error" role="alert" hidden></span>
          </div>
          <div class="form__field">
            <label for="nt-status">Status</label>
            <select id="nt-status" name="status">
              <option value="open" selected>Open</option>
              <option value="in progress">In progress</option>
              <option value="resolved">Resolved</option>
              <option value="closed">Closed</option>
            </select>
            <span id="nt-status-error" class="form__field-error" role="alert" hidden></span>
          </div>
        </div>
        <div class="form__field">
          <label for="nt-assignee">Assignee</label>
          <select id="nt-assignee" name="assigneeId">
            <option value="">— Unassigned —</option>
          </select>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--secondary" data-modal-close>Cancel</button>
          <button type="submit" id="nt-submit" class="btn btn--primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <div id="ticket-detail-modal" class="modal" hidden>
    <div class="modal__backdrop" data-tdm-close tabindex="-1" aria-hidden="true"></div>
    <div
      class="modal__panel panel modal__panel--ticket-detail"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tdm-detail-title"
      data-tdm-panel
    >
      <div class="modal__actions modal__actions--sticky modal__actions--detail-close">
        <button type="button" class="modal__close-x" data-tdm-close aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <p id="tdm-detail-error" class="tickets-state tickets-state--error" role="alert" hidden></p>
      <article class="detail-card detail-card--modal">
        <header class="detail-card__head detail-card__head--row">
          <div>
            <p class="detail-card__id" id="tdm-detail-id">—</p>
            <h2 class="detail-card__title" id="tdm-detail-title">—</h2>
          </div>
          <button type="button" id="tdm-detail-delete-btn" class="btn btn--danger">Delete ticket</button>
        </header>
        <dl class="detail-meta">
          <div><dt>Customer</dt><dd id="tdm-detail-customer">—</dd></div>
          <div>
            <dt>Priority</dt>
            <dd class="detail-meta__dd--control">
              <select id="tdm-detail-priority-select" class="detail-meta__select" aria-label="Ticket priority"></select>
              <span id="tdm-detail-priority-error" class="detail-inline-error" role="alert" hidden></span>
            </dd>
          </div>
          <div>
            <dt>Status</dt>
            <dd class="detail-meta__dd--control">
              <select id="tdm-detail-status-select" class="detail-meta__select" aria-label="Ticket status"></select>
              <span id="tdm-detail-status-error" class="detail-inline-error" role="alert" hidden></span>
            </dd>
          </div>
          <div>
            <dt>Assignee</dt>
            <dd class="detail-meta__dd--control">
              <select id="tdm-detail-assignee-select" class="detail-meta__select" aria-label="Assignee"></select>
              <span id="tdm-detail-assignee-error" class="detail-inline-error" role="alert" hidden></span>
            </dd>
          </div>
          <div><dt>Created</dt><dd id="tdm-detail-created">—</dd></div>
        </dl>

        <section class="detail-comments" aria-labelledby="tdm-comments-heading">
          <h2 id="tdm-comments-heading" class="detail-comments__title">Comments</h2>
          <p id="tdm-detail-comments-empty" class="empty-state empty-state--tight" hidden>No comments yet.</p>
          <div id="tdm-detail-comments" class="detail-comments__list"></div>

          <div class="form form--inline-comment">
            <span id="tdm-comment-error" class="form__error" role="alert" hidden></span>
            <div class="form__field">
              <label for="tdm-comment-body">Add a comment</label>
              <textarea id="tdm-comment-body" name="body" rows="3" placeholder="Write an update…"></textarea>
            </div>
          </div>
        </section>

        <div class="detail-save-bar">
          <p id="tdm-detail-save-error" class="detail-inline-error" role="alert" hidden></p>
          <button type="button" id="tdm-detail-save-btn" class="btn btn--primary" disabled>Save changes</button>
        </div>
      </article>
    </div>
  </div>

  <script type="module" src="../src/main.js"></script>
</body>
</html>
