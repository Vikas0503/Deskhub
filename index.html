<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Deskhub</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body data-page="login">
  <main class="page">
    <header class="page__header">
      <h1 class="page__title">Deskhub</h1>
      <p class="page__lede">Sign in to continue</p>
    </header>

    <section class="panel" aria-labelledby="login-heading">
      <h2 id="login-heading" class="panel__title">Log in</h2>

      <form id="login-form" class="form" novalidate>
        <span id="login-error" class="form__error" role="alert" aria-live="polite" hidden></span>

        <div class="form__field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="username"
            required
            placeholder="you@example.com"
          />
        </div>

        <div class="form__field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
          />
        </div>

        <button type="submit" class="form__submit">Sign in</button>
      </form>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
