<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Deskhub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body data-page="login">
  <div class="app-shell app-shell--center">
    <header class="app-bar app-bar--minimal" role="banner">
      <span class="app-bar__brand">Deskhub</span>
    </header>
    <main class="app-shell__main page page--auth">
      <header class="page__header">
        <h1 class="page__title">Welcome back</h1>
        <p class="page__lede">Sign in to continue</p>
      </header>

      <section class="panel" aria-labelledby="login-heading">
        <h2 id="login-heading" class="panel__title">Log in</h2>

        <form id="login-form" class="form" novalidate>
          <span id="login-error" class="form__error" role="alert" aria-live="polite" hidden></span>

          <div class="form__field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="username"
              required
              placeholder="you@example.com"
            />
          </div>

          <div class="form__field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
            />
          </div>

          <button type="submit" class="form__submit">Sign in</button>
        </form>

        <p class="panel__footer">
          New here? <a href="./signup.html">Create an account</a>
        </p>
      </section>
    </main>
  </div>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
